name: Build and Release Themis

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'gcc_64'
          
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential wget libgl1-mesa-dev libxcb-cursor0
          
      - name: Build Linux AppImage
        run: |
          qmake ThemisLinux.pro
          make -j$(nproc)
          
          # Use linuxdeploy (modern alternative to linuxdeployqt which fails on Ubuntu 24.04)
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          
          # Setup AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ThemisLinux AppDir/usr/bin/
          cp themis_logo.png AppDir/usr/share/icons/hicolor/256x256/apps/ThemisLinux.png
          
          cat << 'DESKTOP' > AppDir/usr/share/applications/ThemisLinux.desktop
          [Desktop Entry]
          Name=ThemisLinux
          Exec=ThemisLinux
          Icon=ThemisLinux
          Type=Application
          Categories=Development;Education;
          DESKTOP
          
          export QMAKE=$(which qmake)
          export OUTPUT=ThemisLinux.AppImage
          export VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0")
          
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThemisLinux.AppImage
          path: ThemisLinux*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_mingw'
          # Use specific mirror if the default one is flaky
          mirror: 'http://mirrors.ocf.berkeley.edu/qt/'
          
      - name: Build Windows
        run: |
          mkdir build-win
          cd build-win
          qmake ../ThemisLinux.pro
          mingw32-make -j4
          
      - name: Package Windows
        shell: bash
        run: |
          mkdir Themis-Windows
          cp build-win/release/ThemisLinux.exe Themis-Windows/
          
          # Tải MinGW-MCF và Python 3.11 vào thư mục để Themis chấm bài
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o mingw.7z "https://gcc-mcf.lhmouse.com/mingw-w64-gcc-mcf_20260922_16.2.1_x64-ucrt_b2a3bb22f94ae2f7eb4b0d7a11ed1b66d2a36802.7z"
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o python.zip "https://www.python.org/ftp/python/3.11.0/python-3.11.0-amd64.zip"
          
          7z x mingw.7z -oThemis-Windows/
          mkdir Themis-Windows/PYTHON
          unzip python.zip -d Themis-Windows/PYTHON/
          
          # Dùng windeployqt để tự động nhúng các DLL Qt cần thiết
          windeployqt --compiler-runtime Themis-Windows/ThemisLinux.exe
          
          7z a Themis-Windows.zip Themis-Windows/
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Themis-Windows.zip
          path: Themis-Windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ThemisLinux.AppImage
      - uses: actions/download-artifact@v4
        with:
          name: Themis-Windows.zip
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ThemisLinux*.AppImage
            Themis-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
