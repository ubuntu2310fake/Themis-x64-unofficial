name: Build and Release Themis

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - name: Install Dependencies
        run: |
          dnf update -y
          dnf install -y git make gcc-c++ qt6-qtbase-devel mingw64-qt6-qtbase mingw64-gcc-c++ wget p7zip p7zip-plugins zip unzip
          
      - uses: actions/checkout@v4
      
      - name: Build Linux AppImage
        run: |
          qmake-qt6 ThemisLinux.pro
          make -j$(nproc)
          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt
          chmod a+x linuxdeployqt
          export VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0")
          ./linuxdeployqt ThemisLinux -appimage -unsupported-allow-new-glibc -qmake=/usr/bin/qmake-qt6
          mv ThemisLinux-*-x86_64.AppImage ThemisLinux.AppImage
          
      - name: Build Windows & Package
        run: |
          mkdir build-win && cd build-win
          x86_64-w64-mingw32-qmake-qt6 ../ThemisLinux.pro
          make -j$(nproc)
          cd ..
          
          mkdir Themis-Windows
          cp build-win/release/ThemisLinux.exe Themis-Windows/
          
          # Download Dependencies
          wget -c "https://gcc-mcf.lhmouse.com/mingw-w64-gcc-mcf_20260922_16.2.1_x64-ucrt_b2a3bb22f94ae2f7eb4b0d7a11ed1b66d2a36802.7z" -O mingw.7z
          wget -c "https://www.python.org/ftp/python/3.11.0/python-3.11.0-amd64.zip" -O python.zip
          
          # Extract and organize
          7z x mingw.7z -oThemis-Windows/
          mkdir Themis-Windows/PYTHON
          unzip python.zip -d Themis-Windows/PYTHON/
          
          # Bundle Qt DLLs for Windows
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/Qt6Core.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/Qt6Gui.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/Qt6Widgets.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/Qt6Xml.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/libgcc_s_seh-1.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/libstdc++-6.dll Themis-Windows/
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/libwinpthread-1.dll Themis-Windows/
          
          mkdir -p Themis-Windows/platforms
          cp /usr/x86_64-w64-mingw32/sys-root/mingw/lib/qt6/plugins/platforms/qwindows.dll Themis-Windows/platforms/
          
          zip -r Themis-Windows.zip Themis-Windows/
          
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ThemisLinux.AppImage
            Themis-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
